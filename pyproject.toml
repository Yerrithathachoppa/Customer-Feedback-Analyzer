[project]
name = "feed-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    'fastapi[standard]>=0.136.3',
    'google-genai>=2.8.0',
    "plotly>=7.0.0",
    "protobuf>=7.36.1",
    'pydantic>=2.13.4',
    'python-dotenv>=1.2.2',
    'requests>=2.34.2',
    'streamlit>=1.58.0',
]

[project.scripts]
feed-analyzer = "feed_analyzer:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
